name: iOS unsigned IPA

# Windows'dan Mac'siz .ipa: bepul macOS runner'da imzolanmagan IPA quriladi,
# keyin uni telefonda eSign o'z sertifikatingiz bilan imzolaydi.
on:
  workflow_dispatch: {}

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode >= 16.1
        run: |
          echo "Mavjud Xcode versiyalari:"
          ls -d /Applications/Xcode_16*.app 2>/dev/null || true
          XC=$(ls -d /Applications/Xcode_16*.app 2>/dev/null | sort -V | tail -n1)
          if [ -z "$XC" ]; then echo "Xcode 16 topilmadi!"; ls -d /Applications/Xcode_*.app; exit 1; fi
          echo "Tanlandi: $XC"
          sudo xcode-select -s "$XC/Contents/Developer"
          xcodebuild -version

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Expo prebuild (generate ios/)
        run: npx expo prebuild -p ios --clean --no-install

      - name: Pod install
        run: cd ios && pod install

      - name: Resolve workspace & scheme
        id: xc
        run: |
          cd ios
          WS=$(ls -d *.xcworkspace | head -n1)
          echo "ws=$WS" >> "$GITHUB_OUTPUT"
          echo "scheme=$(basename "$WS" .xcworkspace)" >> "$GITHUB_OUTPUT"

      - name: Build (unsigned)
        run: |
          cd ios
          set -o pipefail
          xcodebuild \
            -workspace "${{ steps.xc.outputs.ws }}" \
            -scheme "${{ steps.xc.outputs.scheme }}" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" CODE_SIGNING_IDENTITY="" \
            clean build 2>&1 | tee xcodebuild.log

      - name: Show real errors (on failure)
        if: failure()
        run: |
          echo "================= error: qatorlari ================="
          grep -nE "error:" ios/xcodebuild.log | head -80 || true
          echo "================= oxirgi 80 qator ================="
          tail -80 ios/xcodebuild.log || true

      - name: Package unsigned .ipa
        run: |
          cd ios
          APP=$(ls -d build/Build/Products/Release-iphoneos/*.app | head -n1)
          echo "App bundle: $APP"
          rm -rf Payload PlaneRadar-unsigned.ipa
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qr PlaneRadar-unsigned.ipa Payload
          ls -lh PlaneRadar-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: PlaneRadar-unsigned-ipa
          path: ios/PlaneRadar-unsigned.ipa
          if-no-files-found: error
