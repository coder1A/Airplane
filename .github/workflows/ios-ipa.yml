name: iOS unsigned IPA

# Windows'dan Mac'siz .ipa: bepul macOS runner'da imzolanmagan IPA quriladi,
# keyin uni telefonda eSign o'z sertifikatingiz bilan imzolaydi.
on:
  workflow_dispatch: {}

jobs:
  build:
    runs-on: macos-15
    env:
      # Real airport schedules (AeroDataBox). Set this in
      # Settings → Secrets and variables → Actions → New repository secret.
      # If unset, the app falls back to demo schedules.
      EXPO_PUBLIC_AERODATABOX_KEY: ${{ secrets.AERODATABOX_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Select best Xcode
        run: |
          echo "Mavjud Xcode versiyalari:"
          ls -d /Applications/Xcode_*.app 2>/dev/null || true
          # RN 0.86 / Expo 57 uchun Xcode 26 afzal; bo'lmasa eng yuqori STABIL (beta emas)
          XC=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | grep -viE 'beta' | sort -V | tail -n1)
          [ -z "$XC" ] && XC=$(ls -d /Applications/Xcode_*.app 2>/dev/null | grep -viE 'beta' | sort -V | tail -n1)
          if [ -z "$XC" ]; then echo "Xcode topilmadi!"; exit 1; fi
          echo "Tanlandi: $XC"
          sudo xcode-select -s "$XC/Contents/Developer"
          xcodebuild -version
          xcrun swiftc --version || true

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Diagnostics — make ExpoModulesJSI build verbose
        run: |
          F=node_modules/expo-modules-jsi/apple/scripts/build-xcframework.sh
          if [ -f "$F" ]; then
            sed -i.bak '/-quiet \\$/d' "$F"
            echo "Patched (removed -quiet):"
            grep -nE "xcodebuild|-quiet|-destination|-sdk" "$F" | head -20 || true
          else
            echo "$F topilmadi (o'tkazib yuborildi)"
          fi

      - name: Expo prebuild (generate ios/)
        run: npx expo prebuild -p ios --clean --no-install

      - name: Pod install
        run: cd ios && pod install

      - name: Resolve workspace & scheme
        id: xc
        run: |
          cd ios
          WS=$(ls -d *.xcworkspace | head -n1)
          echo "ws=$WS" >> "$GITHUB_OUTPUT"
          echo "scheme=$(basename "$WS" .xcworkspace)" >> "$GITHUB_OUTPUT"

      - name: Build (unsigned)
        run: |
          cd ios
          set -o pipefail
          xcodebuild \
            -workspace "${{ steps.xc.outputs.ws }}" \
            -scheme "${{ steps.xc.outputs.scheme }}" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" CODE_SIGNING_IDENTITY="" \
            clean build 2>&1 | tee xcodebuild.log

      - name: Show real errors (on failure)
        if: failure()
        run: |
          LOG=ios/xcodebuild.log
          [ -f "$LOG" ] || LOG=/dev/null
          {
            echo "## ❌ iOS build xatolari"
            echo ""
            echo "### \`error:\` qatorlari (kontekst bilan)"
            echo '```'
            grep -nE -A3 "error:|fatal error:|cannot find|no such module|no such file|ambiguous" "$LOG" | head -200 || echo "(error: qatori topilmadi)"
            echo '```'
            echo ""
            echo "### Log oxiri (80 qator)"
            echo '```'
            tail -80 "$LOG"
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload full build log (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: ios/xcodebuild.log
          if-no-files-found: warn

      - name: Package unsigned .ipa
        run: |
          cd ios
          APP=$(ls -d build/Build/Products/Release-iphoneos/*.app | head -n1)
          echo "App bundle: $APP"
          rm -rf Payload PlaneRadar-unsigned.ipa
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qr PlaneRadar-unsigned.ipa Payload
          ls -lh PlaneRadar-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: PlaneRadar-unsigned-ipa
          path: ios/PlaneRadar-unsigned.ipa
          if-no-files-found: error
